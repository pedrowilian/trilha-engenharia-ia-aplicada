<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="teia-social-title">
  <title id="teia-social-title">TEIA — Trilha de Engenharia de IA Aplicada</title>
  <!-- Card 1280x640 para Settings > Social preview do GitHub.
       ATENCAO: o GitHub so aceita PNG/JPG/GIF nesse campo. Este SVG e o
       arquivo-fonte; rasterize antes de subir (ver BRANDING.md).
       Diferente dos lockups, aqui as linhas de texto usam <text>: a
       rasterizacao acontece numa maquina com fontes, nao no navegador de quem
       olha, entao a dependencia de fonte e resolvida no ato de gerar o PNG. -->

  <rect width="1280" height="640" fill="#0D1117" />

  <!-- Lockup TEIA (variante dark) escalado 4x e centralizado -->
  <g transform="translate(264 132) scale(4)">
    <g transform="translate(4 2) scale(1.5)">
      <g fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round">
        <path d="M5 28 L11 22" />
        <path d="M11 22 L16 10" />
        <path d="M11 22 L21 20" />
        <path d="M16 10 L27 6" />
        <path d="M21 20 L27 6" />
      </g>
      <g fill="#E6EDF3">
        <circle cx="5" cy="28" r="3" />
        <circle cx="11" cy="22" r="3" />
        <circle cx="16" cy="10" r="3" />
        <circle cx="21" cy="20" r="3" />
      </g>
      <circle cx="27" cy="6" r="3" fill="#22D3EE" />
    </g>
    <g fill="none" stroke="#E6EDF3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M72 16 H92 M82 16 V40" />
      <path d="M106 16 V40 M106 16 H123 M106 28 H120 M106 40 H123" />
      <path d="M137 16 V40" />
      <path d="M151 40 L162 16 L173 40 M156.5 29 H167.5" />
