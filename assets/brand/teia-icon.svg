<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="teia-icon-title">
  <title id="teia-icon-title">TEIA</title>
  <!-- Simbolo TEIA: DAG de 5 nos. Cauda A->B = a trilha; celula fechada
       B->C->E / B->D->E = a teia. Todas as arestas sobem para a direita. -->
  <g fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round">
    <path d="M5 28 L11 22" />
    <path d="M11 22 L16 10" />
    <path d="M11 22 L21 20" />
    <path d="M16 10 L27 6" />
    <path d="M21 20 L27 6" />
  </g>
  <g fill="#E6EDF3">
    <circle cx="5" cy="28" r="3" />
    <circle cx="11" cy="22" r="3" />
    <circle cx="16" cy="10" r="3" />
    <circle cx="21" cy="20" r="3" />
  </g>
  <circle cx="27" cy="6" r="3" fill="#22D3EE" />
</svg>
