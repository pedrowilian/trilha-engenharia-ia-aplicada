# Mapa de Competências — fonte estruturada (validável)
#
# Liga cada resultado de aprendizagem (derivado dos `objetivos_de_aprendizagem`
# das lições) a ao menos uma exigência do cargo de AI Engineer.
# A visão legível correspondente é gerada em `mapa-de-competencias.md`.
#
# Regras de completude (checadas pelo validador):
#   - Sem outcomes órfãos: todo resultado tem >= 1 exigencia e uma licao válida (R8.1, R8.6).
#   - Cobertura das 8 exigências de mercado (categoria `mercado-8`), cada uma com >= 1 resultado (R8.2).
#   - Cobertura dos 4 fundamentos clássicos de entrevista (categoria `ml-classico-4`), cada um com >= 1 resultado (R8.3).
#   - Sem exigências sem lição: toda exigência é entregue por >= 1 lição (R8.5).
#   - Referência cruzada: o campo `competencias` no front-matter das lições referencia as exigências entregues (R8.4).

exigencias_mercado:            # 8 exigências de mercado (R8.2)
  - id: req-llm-apps
    descricao: "Desenvolvimento de aplicações LLM"
    categoria: mercado-8
  - id: req-rag
    descricao: "Engenharia de pipelines RAG"
    categoria: mercado-8
  - id: req-agentes
    descricao: "Construção de agentes"
    categoria: mercado-8
  - id: req-prompt
    descricao: "Prompt engineering"
    categoria: mercado-8
  - id: req-deploy-prod
    descricao: "Deploy em produção"
    categoria: mercado-8
  - id: req-evals
    descricao: "Frameworks de avaliação"
    categoria: mercado-8
  - id: req-custo-inferencia
    descricao: "Gerenciamento de custo de inferência sob alto volume concorrente"
    categoria: mercado-8
  - id: req-verificacao-saidas
    descricao: "Verificação de saídas"
    categoria: mercado-8
  # 4 fundamentos clássicos de ML cobrados em entrevista (R8.3)
  - id: req-vies-variancia
    descricao: "Viés-variância"
    categoria: ml-classico-4
  - id: req-calibracao
    descricao: "Calibração"
    categoria: ml-classico-4
  - id: req-data-leakage
    descricao: "Data leakage"
    categoria: ml-classico-4
  - id: req-gradient-explosion
    descricao: "Gradient explosion"
    categoria: ml-classico-4

